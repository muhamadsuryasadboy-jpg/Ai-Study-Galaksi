</style></head><body><div id="sky"></div><main id="app"></main><nav id="nav" aria-label="Navigasi utama"></nav><div id="ov" onclick="if(event.target===this)closeSheet()"><div id="sh" role="dialog" aria-modal="true"></div></div><div id="toast" role="status"></div><script>/* ===== AI STUDY MEMORY: logika (tanpa DOM) ===== */
const KEY='aism_v1',DAY=864e5;

const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])},today=()=>ymd(NOWF());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)},diffD=(a,b)=>Math.round((pd(a)-pd(b))/DAY),validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(pd(s))===s;
const isInt=n=>Number.isInteger(n),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),pct=(a,b)=>b>0?Math.round(a/b*100):0;

const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9²³π√+\-=\/ ]+/g,' ').replace(/\s+/g,' ').trim();
const cut=(s,n)=>{s=String(s==null?'':s);return s.length>n?s.slice(0,n):s};
const DOWN=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],dow=s=>(pd(s).getDay()+6)%7;
const SUBJ_ICONS=['📘','📗','📙','📕','🧮','🔬','🌍','💻','🔧','🗣️','✍️','🕌','🏛️','⚙️'];

/* ---------- model ---------- */
const DEFSET=()=>({name:'',avatar:'🚀',theme:'galaksi',lite:false,dailyGoal:20,dailyMin:15,examDate:'',active:[true,true,true,true,true,true,true],steps:[0,1,3,7,14,30],remind:{on:false,time:'19:00',last:''},speedSec:60,onboarded:false,ai:{provider:'gemini',endpoint:'',model:'',key:'',ctx:true}});
function fresh(){const s={v:1,settings:DEFSET(),subjects:[],chapters:[],cards:[],notes:[],log:[],sess:[],exams:[],chats:[],best:{},seen:[],usage:[],nid:1};return s}
const newCard=o=>({id:0,sid:o.sid,cid:o.cid,topic:cut(o.topic||'',60),qt:o.qt||'qa',front:cut(o.front,1000),back:cut(o.back||'',3000),kw:cut(o.kw||'',200),ex:cut(o.ex||'',500),note:cut(o.note||'',500),src:cut(o.src||'',100),diff:clamp(isInt(o.diff)?o.diff:2,1,3),fav:!!o.fav,flag:!!o.flag,opts:o.opts||null,ans:o.ans==null?null:o.ans,expl:cut(o.expl||'',600),sample:!!o.sample,created:o.created||today(),srs:o.srs||{tries:0,ok:0,bad:0,doubt:0,first:'',last:'',next:'',lvl:0,hist:[]}});
function cardErr(c,existSid){const qt=c.qt;if(!['qa','mcq','tf','isian','uraian'].includes(qt))return 'Jenis kartu tidak valid.';if(!String(c.front||'').trim())return qt==='tf'?'Pernyataan belum diisi.':'Pertanyaan/bagian depan belum diisi.';
 if(qt==='mcq'){const o=(c.opts||[]).map(x=>String(x).trim());if(o.length<2||o.length>6||o.some(x=>!x))return 'Pilihan jawaban minimal 2, maksimal 6, tidak boleh kosong.';if(new Set(o.map(norm)).size!==o.length)return 'Ada pilihan jawaban yang kembar.';if(!isInt(c.ans)||c.ans<0||c.ans>=o.length)return 'Kunci jawaban belum dipilih.'}
 else if(qt==='tf'){if(typeof c.ans!=='boolean')return 'Pilih Benar atau Salah sebagai kunci.'}
 else if(!String(c.back||'').trim())return 'Jawaban belum diisi.';return ''}
function addSubject(name,icon){name=cut(String(name||'').trim(),40);if(!name)return{ok:false,err:'Nama mata pelajaran belum diisi.'};if(S.subjects.some(s=>norm(s.name)===norm(name)))return{ok:false,err:'Mata pelajaran itu sudah ada.'};const s={id:S.nid++,name,icon:icon||'📘',sample:false};S.subjects.push(s);persist();return{ok:true,s}}
function editSubject(id,name,icon){const s=S.subjects.find(x=>x.id===id);if(!s)return{ok:false,err:'Tidak ditemukan.'};name=cut(String(name||'').trim(),40);if(!name)return{ok:false,err:'Nama belum diisi.'};if(S.subjects.some(x=>x.id!==id&&norm(x.name)===norm(name)))return{ok:false,err:'Nama sudah dipakai.'};s.name=name;s.icon=icon||s.icon;persist();return{ok:true}}
function delSubject(id){S.cards=S.cards.filter(c=>c.sid!==id);S.chapters=S.chapters.filter(c=>c.sid!==id);S.subjects=S.subjects.filter(s=>s.id!==id);S.notes=S.notes.filter(n=>n.sid!==id);persist();return{ok:true}}
function addChapter(sid,name){name=cut(String(name||'').trim(),60);if(!S.subjects.some(s=>s.id===sid))return{ok:false,err:'Pilih mata pelajaran.'};if(!name)return{ok:false,err:'Nama bab belum diisi.'};if(S.chapters.some(c=>c.sid===sid&&norm(c.name)===norm(name)))return{ok:false,err:'Bab itu sudah ada.'};const ord=S.chapters.filter(c=>c.sid===sid).length;const c={id:S.nid++,sid,name,ord};S.chapters.push(c);persist();return{ok:true,c}}
function renameChapter(id,name){const c=S.chapters.find(x=>x.id===id);name=cut(String(name||'').trim(),60);if(!c||!name)return{ok:false,err:'Nama bab belum diisi.'};if(S.chapters.some(x=>x.id!==id&&x.sid===c.sid&&norm(x.name)===norm(name)))return{ok:false,err:'Nama bab sudah ada.'};c.name=name;persist();return{ok:true}}
const chaptersOf=sid=>S.chapters.filter(c=>c.sid===sid).sort((a,b)=>a.ord-b.ord||a.id-b.id);
function moveChapter(id,d){const c=S.chapters.find(x=>x.id===id);if(!c)return;const l=chaptersOf(c.sid),i=l.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];l.forEach((x,k)=>x.ord=k);persist()}
function delChapter(id){S.cards=S.cards.filter(c=>c.cid!==id);S.chapters=S.chapters.filter(c=>c.id!==id);S.notes=S.notes.filter(n=>n.cid!==id);persist();return{ok:true}}
function mergeChapters(fromId,toId){const f=S.chapters.find(x=>x.id===fromId),t=S.chapters.find(x=>x.id===toId);if(!f||!t||f.id===t.id||f.sid!==t.sid)return{ok:false,err:'Pilih dua bab dalam mata pelajaran yang sama.'};S.cards.forEach(c=>{if(c.cid===fromId)c.cid=toId});S.chapters=S.chapters.filter(c=>c.id!==fromId);persist();return{ok:true}}
function saveCard(o,id){const e=cardErr(o);if(e)return{ok:false,err:e};if(!S.subjects.some(s=>s.id===o.sid)||!S.chapters.some(c=>c.id===o.cid&&c.sid===o.sid))return{ok:false,err:'Pilih mata pelajaran dan bab.'};
 if(id){const c=S.cards.find(x=>x.id===id);if(!c)return{ok:false,err:'Kartu tidak ditemukan.'};const n=newCard(Object.assign({},o,{srs:c.srs,fav:c.fav,flag:c.flag,created:c.created,sample:c.sample}));n.id=id;Object.assign(c,n);persist();return{ok:true,c}}
 const c=newCard(o);c.id=S.nid++;S.cards.push(c);persist();return{ok:true,c}}
function delCard(id){S.cards=S.cards.filter(c=>c.id!==id);persist();return{ok:true}}
function moveCard(id,cid){const c=S.cards.find(x=>x.id===id),ch=S.chapters.find(x=>x.id===cid);if(!c||!ch||ch.sid!==c.sid)return{ok:false,err:'Bab tujuan harus dalam mata pelajaran yang sama.'};c.cid=cid;persist();return{ok:true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function persist(){SAVEERR=!save();checkAch()}
function init(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 if(raw){try{const r=sanitize(JSON.parse(raw));if(r.data)S=r.data;else{LOADERR=r.err.slice(0,2).join(' ');try{localStorage.setItem(KEY+'_rusak',raw)}catch(e){}}}catch(e){LOADERR='Data tersimpan tidak bisa dibaca.';try{localStorage.setItem(KEY+'_rusak',raw)}catch(e2){}}}
 if(!S){S=fresh();addSamples()}const t=today();if(!S.usage.includes(t)){S.usage.push(t);if(S.usage.length>800)S.usage.shift()}SAVEERR=!save()}

/* ---------- SRS ---------- */
const stepsOf=()=>S.settings.steps;
const cstat=c=>{const t=c.srs;if(!t.tries)return'baru';return(t.lvl>=3&&t.ok>=3&&t.ok/t.tries>=.7)?'kuasai':'belajar'};
const isWeak=c=>c.srs.bad>=2&&c.srs.bad*2>=c.srs.ok;
const isDue=(c,td)=>c.srs.tries>0&&c.srs.next&&c.srs.next<=(td||today());
const isOver=(c,td)=>c.srs.tries>0&&c.srs.next&&c.srs.next<(td||today());
const acc=c=>c.srs.tries?Math.round(c.srs.ok/c.srs.tries*100):null;
function review(id,g,mode,dur){const c=S.cards.find(x=>x.id===id);if(!c||!['g','r','b'].includes(g))return null;const t=c.srs,td=today(),st=stepsOf(),was=cstat(c);
 const early=t.tries>0&&t.next>td;if(!t.first)t.first=td;t.tries++;
 if(g==='g'){t.ok++;if(!early)t.lvl=Math.min(t.lvl+1,st.length-1)}else if(g==='r'){t.doubt++;if(!early)t.lvl=Math.max(0,t.lvl-1)}else{t.bad++;t.lvl=0}
 let iv=st[t.lvl];if(g==='r'&&iv<1)iv=1;if(g==='b')iv=0;if(!(early&&g!=='b'))t.next=addD(td,iv);t.last=td;t.hist.push({d:td,l:t.lvl});if(t.hist.length>30)t.hist.shift();

const cardsOf=(sid,cid)=>S.cards.filter(c=>(!sid||c.sid===sid)&&(!cid||c.cid===cid));
const dueCards=(sid,cid)=>cardsOf(sid,cid).filter(c=>isDue(c)).sort((a,b)=>a.srs.next<b.srs.next?-1:1);
const newCards=(sid,cid)=>cardsOf(sid,cid).filter(c=>!c.srs.tries);
const weakCards=(sid,cid)=>cardsOf(sid,cid).filter(isWeak).sort((a,b)=>b.srs.bad-a.srs.bad);

/* Pembaca ZIP minimal (cukup untuk DOCX). want(name) -> true untuk entri yang diambil. */
async function zipRead(buf,want){
 if(!(buf instanceof Uint8Array))buf=new Uint8Array(buf);
 const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let e=-1;
 for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('Bukan berkas ZIP/DOCX yang valid.');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
 for(let k=0;k<n;k++){
  if(p+46>buf.length||dv.getUint32(p,true)!==0x02014b50)break;
  const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),usz=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=UTF8.decode(buf.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
  if(!want(name))continue;
  if(usz>30e6)throw new Error('Isi DOCX terlalu besar.');
  const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true),ds=lo+30+lnl+lxl,raw=buf.subarray(ds,ds+csz);
  if(method===0)out[name]=raw;else if(method===8)out[name]=await inflateRaw(raw);else throw new Error('Metode kompresi ZIP tidak didukung.');

function wParas(x){const r=[],re=/<w:p[\s>][\s\S]*?<\/w:p>/g;let m;while((m=re.exec(x))){const p=m[0];let t='',tk=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\s*\/>|<w:br\s*\/>/g,q;while((q=tk.exec(p))){t+=q[1]!==undefined?q[1]:' '}t=xdec(t).replace(/[ \t]+/g,' ').trim();const h=/<w:pStyle\s+w:val="(?:Heading|Judul|Title)[^"]*"/i.test(p);if(t)r.push(h?'# '+t:t)}return r}
function docxXmlText(xml){

let _pdfLib=null;

function pdfItemsToText(items){let out='',lastY=null;items.forEach(it=>{if(typeof it.str!=='string')return;const y=it.transform?Math.round(it.transform[5]):null;if(out&&lastY!==null&&y!==null&&Math.abs(y-lastY)>3&&!/\n$/.test(out))out+='\n';else if(out&&!/[\n ]$/.test(out)&&it.str&&!/^[ ,.;:!?)]/.test(it.str)&&lastY!==null&&y!==null&&Math.abs(y-lastY)<=3)out+=' ';out+=it.str;if(it.hasEOL)out+='\n';if(y!==null)lastY=y});return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim()}

  const lim=Math.min(doc.numPages,15);let o=[];for(let i=1;i<=lim;i++){if(prog)prog('PDF tampak hasil pindai. OCR halaman '+i+' dari '+lim+'...');const pg=await doc.getPage(i),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;o.push(await ocrSource(cv,prog))}

function fileKind(f){const nm=f.name||'';if(/\.doc$/i.test(nm))return'olddoc';if(/\.pdf$/i.test(nm)||f.type==='application/pdf')return'pdf';if(/\.docx$/i.test(nm))return'docx';if(/^image\//.test(f.type)||/\.(png|jpe?g|webp|bmp|gif)$/i.test(nm))return'img';return'text'}

function openList(f){V.ls.f=f;V.ls.q='';openPage('list')}
function listCards(){const l=V.ls,q=norm(l.q);return S.cards.filter(c=>{if(l.sid&&c.sid!==l.sid)return false;const f=l.f;if(f==='due'&&!isDue(c))return false;if(f==='over'&&!isOver(c))return false;if(f==='new'&&c.srs.tries)return false;if(f==='weak'&&!isWeak(c))return false;if(f==='master'&&cstat(c)!=='kuasai')return false;if(f==='fav'&&!c.fav)return false;if(f==='flag'&&!c.flag)return false;
 if(q){const t=norm(c.front+' '+c.back+' '+c.kw+' '+c.topic+' '+(c.opts||[]).join(' '));if(!t.includes(q))return false}return true}).sort((a,b)=>(a.srs.next||'9')<(b.srs.next||'9')?-1:1)}
const SI={baru:'🆕',belajar:'📖',kuasai:'✅'};
function cardRow(c){const a=acc(c);return`<button class="li" onclick="cardOpen(${c.id})"><div class="dot">${SI[cstat(c)]}</div><div class="f1"><div class="b" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.fav?'⭐ ':''}${esc(c.front.split('\n')[0])}</div><div class="sm mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sname(c.sid))} › ${esc(cname(c.cid))}${a!=null?' · akurasi '+a+'%':''}${c.srs.next?' · review '+fmtD(c.srs.next):''}</div></div>${c.sample?'<span class="badge ct">Contoh</span>':''}</button>`}
function pgList(){const l=V.ls,items=listCards();return hd('Daftar materi')+`<input id="lq" placeholder="Cari kata kunci" value="${esc(l.q)}" oninput="V.ls.q=this.value;listRefresh()" aria-label="Cari"><div class="chips">${LF.map(x=>chip(x[1],l.f===x[0],`V.ls.f='${x[0]}';render()`)).join('')}</div><select onchange="V.ls.sid=+this.value;render()" aria-label="Mata pelajaran">${subjOpts(l.sid,1)}</select><div class="row sp" style="margin-top:8px"><span class="sm mu" id="lcnt">${items.length} kartu</span>${items.length?`<button class="btn s" onclick="startStudy('list')">Pelajari daftar ini</button>`:''}</div><div class="c" id="lbox">${items.length?items.slice(0,150).map(cardRow).join(''):empty('Tidak ada kartu pada filter ini.')}</div>${items.length>150?'<p class="sm mu">Menampilkan 150 pertama. Persempit dengan pencarian.</p>':''}`}
function listRefresh(){const items=listCards(),b=$('lbox');if(b){b.innerHTML=items.length?items.slice(0,150).map(cardRow).join(''):empty('Tidak ada kartu pada filter ini.');const c=$('lcnt');if(c)c.textContent=items.length+' kartu'}}
function cardOpen(id){const c=S.cards.find(x=>x.id===id);if(!c)return;const t=c.srs,body=c.qt==='mcq'?c.opts.map((o,i)=>(i===c.ans?'✅ ':'▫️ ')+o).join('\n')+(c.expl?'\n\n'+c.expl:''):c.qt==='tf'?(c.ans?'Benar':'Salah')+(c.expl?'\n'+c.expl:''):c.back;
 openSheet(`<div class="row sp"><span class="badge">${({qa:'Flashcard',mcq:'Pilihan ganda',tf:'Benar/Salah',isian:'Isian',uraian:'Uraian'})[c.qt]}</span>${c.sample?'<span class="badge ct">Contoh</span>':''}</div><div class="fc" style="min-height:0"><div class="q">${esc(c.front)}</div><div>${esc(body)}</div>${c.kw?`<div class="sm mu">Kata kunci: ${esc(c.kw)}</div>`:''}${c.ex?`<div class="sm">Contoh: ${esc(c.ex)}</div>`:''}${c.note?`<div class="sm">Catatan: ${esc(c.note)}</div>`:''}${c.src?`<div class="sm mu">Sumber: ${esc(c.src)}</div>`:''}</div>
 <div class="g3">${kv('Status',cstat(c))}${kv('Percobaan',t.tries)}${kv('Akurasi',acc(c)==null?'–':acc(c)+'%')}${kv('Benar/Salah/Ragu',t.ok+'/'+t.bad+'/'+t.doubt)}${kv('Review berikut',t.next?fmtD(t.next):'–')}${kv('Tingkat',t.lvl+'/'+(stepsOf().length-1))}</div><p class="sm mu">${esc(sname(c.sid))} › ${esc(cname(c.cid))}${c.topic?' › '+esc(c.topic):''}</p>
 <div class="row wrap"><button class="btn sec s" onclick="favTog(${id})">${c.fav?'★ Favorit':'☆ Favorit'}</button><button class="btn sec s" onclick="closeSheet(1);cardForm(${id})">Edit</button><button class="btn sec s" onclick="flagTog(${id})">${c.flag?'⚑ Batalkan laporan':'⚑ Laporkan'}</button><button class="btn dg s" onclick="cardDel(${id})">Hapus</button></div>`)}
function favTog(id){const c=S.cards.find(x=>x.id===id);if(c){c.fav=!c.fav;persist();cardOpen(id);if(!V.run)render();else renderKeep()}}
function flagTog(id){const c=S.cards.find(x=>x.id===id);if(c){c.flag=!c.flag;persist();toast(c.flag?'Kartu dilaporkan bermasalah. Cek di filter Bermasalah.':'Laporan dibatalkan.');cardOpen(id)}}
function cardDel(id){cfm('Hapus kartu ini? Riwayatnya ikut hilang dan tidak bisa dibatalkan.','Hapus',()=>{delCard(id);closeSheet();toast('Kartu dihapus.');render()},1)}
const renderKeep=()=>render();

/* ---------- sesi flashcard ---------- */
function startStudy(kind,sid,cid){let q=[];const L=n=>shuf(n).slice(0,50);
 if(kind==='due')q=dueCards(sid,cid);else if(kind==='new')q=newCards(sid,cid).slice(0,Math.max(5,S.settings.dailyGoal));else if(kind==='weak')q=weakCards(sid,cid);else if(kind==='list')q=listCards();
 else if(kind==='all')q=L(cardsOf(sid,cid));else{const d=dueCards(sid,cid),room=Math.max(5,S.settings.dailyGoal-d.length);q=d.concat(newCards(sid,cid).slice(0,room))}
 q=q.slice(0,60);if(!q.length){toast(kind==='due'?'Tidak ada kartu jatuh tempo. Coba Materi baru.':'Belum ada kartu untuk dipelajari.');return}
 V.run={mode:'kartu',q:q.map(c=>c.id),i:0,show:false,g:0,r:0,b:0,skip:0,t0:Date.now(),start:Date.now()};openPage('study')}
function pgStudy(){const r=V.run;if(!r||r.mode!=='kartu')return hd('Belajar')+empty('Sesi tidak aktif.');
 while(r.i<r.q.length&&!S.cards.find(x=>x.id===r.q[r.i]))r.i++;
 if(r.i>=r.q.length){const n=r.g+r.r+r.b;return hd('Sesi selesai')+`<div class="hero ctr"><div style="font-size:40px">🎉</div><h1>Selesai!</h1><p>${n} kartu dijawab · ${dur(Math.round((Date.now()-r.start)/1000))}</p></div><div class="g3">${kv('Hafal',r.g,'ok')}${kv('Ragu',r.r,'warn')}${kv('Lupa',r.b,'bad')}</div><p class="sm mu">Jadwal review tiap kartu sudah diperbarui sesuai jawabanmu.</p><div class="row" style="margin-top:12px"><button class="btn sec f1" onclick="back()">Selesai</button><button class="btn f1" onclick="startStudy('mix')">Lanjut belajar</button></div>`}
 const c=S.cards.find(x=>x.id===r.q[r.i]),tl={qa:'Pertanyaan',mcq:'Soal pilihan ganda',tf:'Pernyataan: benar atau salah?',isian:'Isian singkat',uraian:'Soal uraian'}[c.qt];
 let back2='';if(r.show){back2=c.qt==='mcq'?`<div>${c.opts.map((o,i)=>(i===c.ans?'✅ ':'▫️ ')+esc(o)).join('<br>')}</div>${c.expl?`<div class="sm">${esc(c.expl)}</div>`:''}`:c.qt==='tf'?`<div class="b ${c.ans?'ok':'bad'}">${c.ans?'Benar':'Salah'}</div>${c.expl?`<div class="sm">${esc(c.expl)}</div>`:''}`:`<div style="font-size:17px">${esc(c.back)}</div>`;back2+=(c.kw?`<div class="sm mu">Kata kunci: ${esc(c.kw)}</div>`:'')+(c.ex?`<div class="sm">Contoh: ${esc(c.ex)}</div>`:'')+(c.note?`<div class="sm">Catatan: ${esc(c.note)}</div>`:'')+(c.src?`<div class="sm mu">Sumber: ${esc(c.src)}</div>`:'')}
 const mcShow=c.qt==='mcq'&&!r.show?c.opts.map((o,i)=>`<div class="sm">${String.fromCharCode(65+i)}. ${esc(o)}</div>`).join(''):'';
 return hd(`Belajar ${r.i+1}/${r.q.length}`)+pb(r.i/r.q.length*100)+`<div class="fc"><div class="row sp"><span class="badge">${tl}</span><span class="sm mu">${esc(cname(c.cid))}</span></div><div class="q">${esc(c.front)}</div>${mcShow}${r.show?'<hr style="border:0;border-top:1px dashed var(--line);width:100%">'+back2:''}</div>`+
 (r.show?`<div class="g3"><button class="btn ok2" onclick="studyAns('g')">✓ Hafal</button><button class="btn sec" onclick="studyAns('r')">? Ragu</button><button class="btn dg" onclick="studyAns('b')">✗ Lupa</button></div>`:`<button class="btn w" onclick="V.run.show=true;render()">Tampilkan jawaban</button>`)+
 `<div class="row sp" style="margin-top:10px"><button class="ib" onclick="favTog(${c.id})">${c.fav?'★':'☆'} Favorit</button><button class="ib" onclick="cardForm(${c.id})">✏️ Edit</button><button class="ib" onclick="flagTog(${c.id})">⚑ Laporkan</button><button class="ib" onclick="studySkip()">⏭ Lewati</button></div>`}
function studyAns(g){const r=V.run,id=r.q[r.i];review(id,g,'kartu',(Date.now()-r.t0)/1000);r[g==='g'?'g':g==='r'?'r':'b']++;r.i++;r.show=false;r.t0=Date.now();render();flushEvents()}
function studySkip(){const r=V.run;r.skip++;r.i++;r.show=false;r.t0=Date.now();render()}

/* ---------- riwayat review ---------- */
function pgHist(){const l=S.log.slice().reverse().slice(0,120);let h=hd('Riwayat review');if(!l.length)return h+`<div class="c">${empty('Belum ada aktivitas belajar.')}</div>`;let last='';h+='<div class="c">';l.forEach(x=>{if(x.d!==last){last=x.d;h+=`<div class="b sm" style="margin:10px 0 4px">${fmtD(x.d)}</div>`}const c=S.cards.find(k=>k.id===x.k);h+=`<div class="row sp sm" style="padding:5px 0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68%">${esc(c?c.front.split('\n')[0]:'(kartu dihapus)')}</span><span class="${x.g==='g'?'ok':x.g==='b'?'bad':'warn'}">${x.g==='g'?'✓ Benar':x.g==='b'?'✗ Salah':'? Ragu'} · ${esc(x.mode)}</span></div>`});return h+'</div>'}

/* ---------- kelola materi ---------- */
function pgMat(){let h=hd('Kelola materi')+`<button class="btn w" onclick="subjForm()">+ Mata pelajaran baru</button>`;if(!S.subjects.length)return h+`<div class="c">${empty('Belum ada mata pelajaran.')}</div>`;
 return h+S.subjects.map(s=>{const c=counts(s.id);return`<button class="c li" style="display:flex;width:100%;margin:8px 0" onclick="openPage('subj',${s.id})"><div class="dot">${s.icon}</div><div class="f1"><div class="b">${esc(s.name)} ${s.sample?'<span class="badge ct">Contoh</span>':''}</div><div class="sm mu">${chaptersOf(s.id).length} bab · ${c.total} kartu · ${c.mastered} dikuasai</div>${pb(pct(c.mastered,c.total))}</div><span class="mu">›</span></button>`}).join('')}
function subjForm(id){const s=id?S.subjects.find(x=>x.id===id):null;V.f={id:id||0,icon:s?s.icon:'📘'};openSheet(`<h3>${s?'Ubah':'Tambah'} mata pelajaran</h3><label class="f" for="sn">Nama</label><input id="sn" maxlength="40" value="${esc(s?s.name:'')}" placeholder="Misal: Bahasa Inggris"><label class="f">Ikon</label><div class="chips" style="flex-wrap:wrap">${SUBJ_ICONS.map(i=>`<button class="chip ${i===V.f.icon?'on':''}" onclick="V.f.icon='${i}';subjForm2()">${i}</button>`).join('')}</div><div class="err" id="fe"></div><button class="btn w" onclick="subjSave()">Simpan</button>`)}
function subjForm2(){const n=val('sn');subjForm(V.f.id);V.sheet=1;$('sn').value=n}
function subjSave(){const r=V.f.id?editSubject(V.f.id,val('sn'),V.f.icon):addSubject(val('sn'),V.f.icon);if(!r.ok){$('fe').textContent=r.err;return}closeSheet();render();toast('Tersimpan.')}
function pgSubj(sid){const s=S.subjects.find(x=>x.id===sid);if(!s)return hd('Mapel')+empty('Tidak ditemukan.');const chs=chaptersOf(sid),c=counts(sid);
 let h=hd(esc(s.icon+' '+s.name))+`<div class="g3">${kv('Kartu',c.total)}${kv('Dikuasai',c.mastered,'ok')}${kv('Review',c.due)}</div><div class="row wrap" style="margin-top:10px"><button class="btn s" onclick="startStudy('mix',${sid})">📖 Belajar</button><button class="btn sec s" onclick="subjForm(${sid})">Ubah</button><button class="btn sec s" onclick="chapForm(0,${sid})">+ Bab</button><button class="btn dg s" onclick="subjDel(${sid})">Hapus</button></div><h2>Bab</h2>`;
 if(!chs.length)return h+`<div class="c">${empty('Belum ada bab. Tambahkan bab dulu.')}</div>`;
 return h+chs.map((ch,i)=>{const k=counts(sid,ch.id);return`<div class="c"><button class="li" style="padding:0;border:0" onclick="openPage('chap',${ch.id})"><div class="f1"><div class="b">${esc(ch.name)}</div><div class="sm mu">${k.total} kartu · ${k.mastered} dikuasai · ${k.due} review</div>${pb(pct(k.mastered,k.total))}</div><span class="mu">›</span></button><div class="row wrap" style="margin-top:6px"><button class="ib" onclick="chapMove(${ch.id},-1)" ${i?'':'disabled'} aria-label="Naikkan">↑</button><button class="ib" onclick="chapMove(${ch.id},1)" ${i<chs.length-1?'':'disabled'} aria-label="Turunkan">↓</button><button class="ib" onclick="chapForm(${ch.id})">Nama</button><button class="ib" onclick="chapMerge(${ch.id})" ${chs.length>1?'':'disabled'}>Gabung</button><button class="ib" onclick="chapDel(${ch.id})">Hapus</button></div></div>`}).join('')}
function subjDel(id){cfm('Hapus mata pelajaran ini beserta semua bab, kartu, dan catatannya? Tidak bisa dibatalkan. Sebaiknya backup dulu.','Hapus',()=>{delSubject(id);closeSheet();V.stack.pop();toast('Mata pelajaran dihapus.');render()},1)}
function chapForm(id,sid){const c=id?S.chapters.find(x=>x.id===id):null;V.f={id:id||0,sid:c?c.sid:sid};openSheet(`<h3>${c?'Ubah nama bab':'Tambah bab'}</h3><input id="cn" maxlength="60" value="${esc(c?c.name:'')}" placeholder="Nama bab"><div class="err" id="fe"></div><button class="btn w" onclick="chapSave()">Simpan</button>`)}
function chapSave(){const r=V.f.id?renameChapter(V.f.id,val('cn')):addChapter(V.f.sid,val('cn'));if(!r.ok){$('fe').textContent=r.err;return}closeSheet();render()}
function chapMove(id,d){moveChapter(id,d);render()}
function chapMerge(id){const c=S.chapters.find(x=>x.id===id),o=chaptersOf(c.sid).filter(x=>x.id!==id);V.f={from:id};openSheet(`<h3>Gabungkan bab</h3><p class="sm">Pindahkan semua kartu dari <b>${esc(c.name)}</b> ke bab lain. Bab ini akan dihapus.</p><select id="mt">${opts(o.map(x=>[x.id,x.name]),'')}</select><div class="err" id="fe"></div><button class="btn w" onclick="chapMerge2()">Gabungkan</button>`)}
function chapMerge2(){const r=mergeChapters(V.f.from,+val('mt'));if(!r.ok){$('fe').textContent=r.err;return}closeSheet();toast('Bab digabung.');render()}
function chapDel(id){cfm('Hapus bab ini beserta semua kartunya? Tidak bisa dibatalkan.','Hapus',()=>{delChapter(id);closeSheet();toast('Bab dihapus.');render()},1)}
function pgChap(cid){const ch=S.chapters.find(x=>x.id===cid);if(!ch)return hd('Bab')+empty('Tidak ditemukan.');const q=norm(V.mat.q),f=V.mat.f,l=cardsOf(ch.sid,cid).filter(c=>(!q||norm(c.front+' '+c.back+' '+c.kw).includes(q))&&(!f||(f==='fav'?c.fav:f==='sulit'?c.diff===3:cstat(c)===f))&&(!V.mat.diff||c.diff===V.mat.diff));
 return hd(esc(ch.name))+`<p class="sm mu">${esc(sname(ch.sid))}</p><div class="row wrap"><button class="btn s" onclick="cardForm(0,${ch.sid},${cid})">+ Kartu</button><button class="btn sec s" onclick="startStudy('all',${ch.sid},${cid})">Belajar bab ini</button></div><input id="mq" style="margin-top:10px" placeholder="Cari di bab ini" value="${esc(V.mat.q)}" oninput="V.mat.q=this.value;matRefresh(${cid})"><div class="chips">${[['','Semua'],['baru','Baru'],['belajar','Belajar'],['kuasai','Dikuasai'],['fav','Favorit'],['sulit','Sulit']].map(x=>chip(x[1],V.mat.f===x[0],`V.mat.f='${x[0]}';render()`)).join('')}</div><div class="c" id="mbox">${l.length?l.map(cardRow).join(''):empty('Tidak ada kartu.')}</div>`}
function matRefresh(cid){const ch=S.chapters.find(x=>x.id===cid),q=norm(V.mat.q),b=$('mbox');if(!b||!ch)return;const l=cardsOf(ch.sid,cid).filter(c=>!q||norm(c.front+' '+c.back+' '+c.kw).includes(q));b.innerHTML=l.length?l.map(cardRow).join(''):empty('Tidak ada kartu.')}

/* ---------- form kartu ---------- */
const QT=[['qa','Flashcard'],['mcq','Pil. ganda'],['tf','Benar/Salah'],['isian','Isian'],['uraian','Uraian']];
function cardForm(id,sid,cid,draft,pre){const c=id?S.cards.find(x=>x.id===id):(pre||null);if(id&&!c)return;V.f={id:id||0,qt:c?c.qt:'qa',sid:c?c.sid:(sid||(S.subjects[0]&&S.subjects[0].id)||0),cid:c?c.cid:cid||0,draft:draft==null?null:draft};if(!V.f.cid&&!draft&&draft!==0){const ch=chaptersOf(V.f.sid)[0];V.f.cid=ch?ch.id:0}
 openSheet(cardFormHtml(c||{}))}
function cardFormHtml(c){const f=V.f,qt=f.qt,isD=f.draft!=null,o=c.opts||['','','',''];while(o.length<6)o.push('');
 const body=qt==='mcq'?`<label class="f">Pilihan jawaban (isi minimal 2)</label>${[0,1,2,3,4,5].map(i=>`<input id="cf_o${i}" style="margin:3px 0" maxlength="300" placeholder="Pilihan ${String.fromCharCode(65+i)}" value="${esc(o[i])}">`).join('')}<label class="f" for="cf_a">Kunci jawaban</label><select id="cf_a">${[0,1,2,3,4,5].map(i=>`<option value="${i}" ${c.ans===i?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}</select><label class="f" for="cf_e">Penjelasan jawaban</label><textarea id="cf_e" rows="2" maxlength="600">${esc(c.expl||'')}</textarea>`
 :qt==='tf'?`<label class="f" for="cf_a">Kunci</label><select id="cf_a"><option value="1" ${c.ans===true?'selected':''}>Benar</option><option value="0" ${c.ans===false?'selected':''}>Salah</option></select><label class="f" for="cf_e">Penjelasan</label><textarea id="cf_e" rows="2" maxlength="600">${esc(c.expl||'')}</textarea>`
 :`<label class="f" for="cf_b">${qt==='uraian'?'Kunci jawaban':'Jawaban / bagian belakang'}</label><textarea id="cf_b" rows="3" maxlength="3000">${esc(c.back||'')}</textarea><label class="f" for="cf_k">Kata kunci (pisahkan dengan koma)</label><input id="cf_k" maxlength="200" value="${esc(c.kw||'')}"><label class="f" for="cf_x">Contoh</label><input id="cf_x" maxlength="500" value="${esc(c.ex||'')}">`;
 return`<h3>${f.id?'Edit kartu':isD?'Edit hasil AI':'Kartu baru'}</h3><div class="chips">${QT.map(x=>chip(x[1],qt===x[0],`cfType('${x[0]}')`)).join('')}</div>
 ${isD?'':`<div class="g2"><div><label class="f" for="cf_s">Mata pelajaran</label><select id="cf_s" onchange="V.f.sid=+this.value;$('cf_c').innerHTML=chapOpts(this.value,0)">${subjOpts(f.sid)}</select></div><div><label class="f" for="cf_c">Bab</label><select id="cf_c">${chapOpts(f.sid,f.cid)}</select></div></div>`}
 <label class="f" for="cf_f">${qt==='tf'?'Pernyataan':qt==='mcq'?'Soal':'Pertanyaan / bagian depan'}</label><textarea id="cf_f" rows="3" maxlength="1000">${esc(c.front||'')}</textarea>${body}
 <div class="g2"><div><label class="f" for="cf_t">Topik (opsional)</label><input id="cf_t" maxlength="60" value="${esc(c.topic||'')}"></div><div><label class="f" for="cf_d">Tingkat kesulitan</label><select id="cf_d">${opts([[1,'Mudah'],[2,'Sedang'],[3,'Sulit']],c.diff||2)}</select></div></div>
 <label class="f" for="cf_n">Catatan</label><input id="cf_n" maxlength="500" value="${esc(c.note||'')}"><label class="f" for="cf_r">Sumber (opsional)</label><input id="cf_r" maxlength="100" value="${esc(c.src||'')}"><div class="err" id="fe"></div><button class="btn w" onclick="cardSave()">Simpan</button>`}
function cardCollect(){const f=V.f,g=id=>val(id),qt=f.qt,o={sid:+g('cf_s')||f.sid,cid:+g('cf_c')||f.cid,qt,front:g('cf_f'),topic:g('cf_t'),diff:+g('cf_d')||2,note:g('cf_n'),src:g('cf_r')};
 if(qt==='mcq'){const raw=[0,1,2,3,4,5].map(i=>g('cf_o'+i).trim()),k=+g('cf_a');o.expl=g('cf_e');if(!raw[k]){o.err='Kunci jawaban menunjuk pilihan yang kosong.'}o.opts=raw.filter(Boolean);o.ans=raw[k]?raw.slice(0,k).filter(Boolean).length:null}
 else if(qt==='tf'){o.ans=g('cf_a')==='1';o.expl=g('cf_e')}else{o.back=g('cf_b');o.kw=g('cf_k');o.ex=g('cf_x')}return o}
function cfType(t){const keep=cardCollect();V.f.qt=t;const c=Object.assign({},keep,{opts:keep.opts&&keep.opts.length?keep.opts:null,ans:t==='mcq'&&typeof keep.ans==='number'?keep.ans:null});V.f.sid=keep.sid;V.f.cid=keep.cid;$('sh').innerHTML=cardFormHtml(c)}
function cardSave(){const o=cardCollect();if(o.err){$('fe').textContent=o.err;return}

 <div class="err" id="fe"></div><button class="btn w" onclick="startQuiz()">Mulai</button>`)}
function pickPool(sid,cid,src){let l=cardsOf(sid,cid);if(src==='due')l=l.filter(c=>isDue(c));else if(src==='weak')l=l.filter(isWeak);else if(src==='new')l=l.filter(c=>!c.srs.tries);return l}
function startQuiz(){const m=V.f.mode,sid=+val('qs'),cid=+val('qc'),src=m==='tantang'?'weak':val('qr')||'all',n=m==='speed'?60:+val('qn')||10;let kinds=m==='tf'?['tf']:m==='tebak'?['mc','multi','odd','tf','full','sim']:m==='tantang'?['mc','tf']:m==='speed'?['mc','tf']:['mc','tf','multi','odd','full','sim','isian'].filter(k=>{const e=$('qk_'+k);return e&&e.checked});
 if(!kinds.length){$('fe').textContent='Pilih minimal satu jenis soal.';return}let pool=pickPool(sid,cid,src);if(m==='tantang')pool=pool.sort((a,b)=>b.srs.bad-a.srs.bad);if(!pool.length){$('fe').textContent=src==='weak'?'Belum ada kartu yang sering salah. Mainkan kuis dulu.':'Tidak ada kartu pada pilihan ini.';return}
 const qs=[];let cyc=m==='speed'?shuf(pool.concat(pool,pool,pool)):(m==='tantang'?pool:shuf(pool));for(const c of cyc){if(qs.length>=n)break;const q=makeQ(c,kinds);if(q)qs.push(q)}if(!qs.length){$('fe').textContent='Tidak bisa membuat soal. Pilihan ganda butuh minimal 4 kartu tanya-jawab berjawaban berbeda dalam mata pelajaran yang sama.';return}
 closeSheet(1);V.run={mode:'quiz',sub:m,cfg:{m,sid,cid,src,n,kinds},qs,i:0,pick:null,done:false,ok:null,correct:0,answered:0,miss:[],start:Date.now(),t0:Date.now(),left:S.settings.speedSec,sid};clearTimers();openPage('run');
 if(m==='speed')TMR=setInterval(()=>{const r=V.run;if(!r||r.sub!=='speed'||r.res){clearTimers();return}r.left--;const e=$('tm');if(e)e.textContent=r.left+' dtk';if(r.left<=0)runFinish()},1000)}
function runView(){const r=V.run;if(!r)return hd('Sesi')+empty('Tidak ada sesi aktif.');if(r.res)return resultView(r);if(r.mode==='quiz')return quizView(r);if(r.mode==='match')return matchView(r);if(r.mode==='typing')return typingView(r);if(r.mode==='memory')return memoryView(r);if(r.mode==='order')return orderView(r);return hd('Sesi')+empty('Sesi tidak dikenal.')}
function quizView(r){const q=r.qs[r.i];if(!q){return hd('Sesi')+empty('Selesai')}const titles={kuis:'Kuis',tebak:'Tebak Pengertian',tf:'Benar atau Salah',tantang:'Tantangan Kesalahan',speed:'Speed'};
 return hd(titles[r.sub])+`<div class="row sp sm"><span>Soal ${r.i+1}/${r.qs.length}</span>${r.sub==='speed'?`<b id="tm">${r.left} dtk</b>`:''}<span>Skor ${r.correct}</span></div>${r.sub==='speed'?'':pb(r.i/r.qs.length*100)}<div class="fc" style="min-height:120px"><div class="q">${esc(q.q)}</div></div>${qBody(q,r,'run')}${r.done?qFeedback(q,r.ok)+`<button class="btn w" onclick="runNext()">${r.i+1>=r.qs.length?'Lihat hasil':'Lanjut'}</button>`:''}`}

 if(r.sub==='speed'){setTimeout(()=>{if(V.run===r&&!r.res&&r.done)runNext()},650)}render()}

function resultView(r){const s=r.res,names={kuis:'Kuis',tebak:'Tebak Pengertian',tf:'Benar atau Salah',tantang:'Tantangan Kesalahan',speed:'Speed Challenge',match:'Mencocokkan',typing:'Mengetik Jawaban',memory:'Kartu Memori',order:'Susun Kalimat'};const miss=[...new Set(s.missed||[])].map(id=>S.cards.find(c=>c.id===id)).filter(Boolean);

 ${miss.length?`<h2>Ringkasan kesalahan</h2><div class="c">${miss.map(c=>`<div style="margin:8px 0"><div class="b">${esc(c.front.split('\n')[0])}</div><div class="sm ok">${esc(c.qt==='mcq'?c.opts[c.ans]:c.qt==='tf'?(c.ans?'Benar':'Salah'):c.back)}</div></div>`).join('')}<p class="sm mu">Kartu yang salah masuk jadwal review hari ini.</p></div>`:''}<div class="row" style="margin-top:12px"><button class="btn sec f1" onclick="back()">Selesai</button><button class="btn f1" onclick="runAgain()">Main lagi</button></div>`}

function pgGames(){const G=[['🔗','Mencocokkan','Cocokkan istilah dengan pengertian',"gameSetup('match')"],['⌨️','Mengetik Jawaban','Ketik jawaban dari pertanyaan',"gameSetup('typing')"],['❓','Kuis Cepat','Pilihan jawaban dengan penilaian otomatis',"quizSetup('kuis')"],['✔️','Benar atau Salah','Tentukan pernyataan benar atau salah',"quizSetup('tf')"],['🃏','Kartu Memori','Cari pasangan istilah dan pengertian',"gameSetup('memory')"],['🧱','Susun Kalimat','Susun kata ke urutan yang tepat',"gameSetup('order')"],['🔥','Tantangan Kesalahan','Ulang kartu yang paling sering salah',"quizSetup('tantang')"],['⚡','Speed Challenge','Jawab sebanyak mungkin dalam waktu terbatas',"quizSetup('speed')"]];
 return hd('Game')+G.map(g=>`<button class="c li" style="display:flex;width:100%;margin:8px 0" onclick="${g[3]}"><div class="dot">${g[0]}</div><div class="f1"><div class="b">${g[1]}</div><div class="sm mu">${g[2]}${(S.best[({'Mencocokkan':'match','Mengetik Jawaban':'typing','Kuis Cepat':'kuis','Benar atau Salah':'tf','Kartu Memori':'memory','Susun Kalimat':'order','Tantangan Kesalahan':'tantang','Speed Challenge':'speed'})[g[1]]]||{}).score!=null?' · rekor '+S.best[({'Mencocokkan':'match','Mengetik Jawaban':'typing','Kuis Cepat':'kuis','Benar atau Salah':'tf','Kartu Memori':'memory','Susun Kalimat':'order','Tantangan Kesalahan':'tantang','Speed Challenge':'speed'})[g[1]]].score:''}</div></div><span class="mu">›</span></button>`).join('')}
function gameSetup(mode){if(!S.cards.length){toast('Belum ada kartu. Tambah materi dulu.');return}const last=S.log.length?S.log[S.log.length-1].sid:(S.subjects[0]&&S.subjects[0].id)||0;V.f={gmode:mode};
 openSheet(`<h3>Pengaturan game</h3><label class="f" for="gs">Mata pelajaran</label><select id="gs" onchange="$('gc').innerHTML=chapOpts(this.value,0,1)">${subjOpts(last,1)}</select><label class="f" for="gc">Bab</label><select id="gc">${chapOpts(last,0,1)}</select><div class="err" id="fe"></div><button class="btn w" onclick="gameStart()">Mulai</button>`)}
function gameStart(){const m=V.f.gmode,sid=+val('gs'),cid=+val('gc'),pool=cardsOf(sid,cid),now=Date.now();let r=null;clearTimers();
 if(m==='match'){const it=matchSet(pool,6);if(it.length<3){$('fe').textContent='Butuh minimal 3 kartu tanya-jawab dengan teks pendek (dan jawaban berbeda).';return}r={mode:'match',items:it.map(c=>c.id),left:shuf(it.map(c=>c.id)),right:shuf(it.map(c=>c.id)),sel:null,done:[],wrong:[],mist:0,total:it.length,start:now,sid,flash:null}}
 else if(m==='typing'){const l=shuf(pool.filter(c=>['qa','isian'].includes(c.qt)&&c.back.length<=90)).slice(0,10);if(!l.length){$('fe').textContent='Butuh kartu tanya-jawab dengan jawaban singkat.';return}r={mode:'typing',q:l.map(c=>c.id),i:0,pick:'',done:false,ok:null,correct:0,miss:[],total:l.length,start:now,t0:now,sid}}
 else if(m==='memory'){const it=matchSet(pool.filter(c=>c.front.length<=60&&c.back.length<=70),6);if(it.length<3){$('fe').textContent='Butuh minimal 3 kartu dengan teks pendek.';return}const tiles=shuf(it.flatMap(c=>[{id:c.id,s:'f',t:shortT(c.front,48)},{id:c.id,s:'b',t:shortT(c.back,48)}]));r={mode:'memory',tiles,up:[],done:[],moves:0,lock:false,total:it.length,start:now,sid}}
 else if(m==='order'){const l=[];const seen=new Set();for(let k=0;k<30&&l.length<8;k++){const o=orderItem(pool);if(o&&!seen.has(o.c.id)){seen.add(o.c.id);l.push(o)}}if(!l.length){$('fe').textContent='Butuh kartu dengan jawaban berupa kalimat (4–14 kata).';return}r={mode:'order',q:l.map(o=>({id:o.c.id,words:o.words})),i:0,built:[],used:[],done:false,ok:null,correct:0,miss:[],total:l.length,start:now,t0:now,sid,sh:null}}

/* mencocokkan */
function matchView(r){const c=id=>S.cards.find(x=>x.id===id);const btn=(id,side,t)=>`<button class="${r.done.includes(id)?'done':''} ${r.sel&&r.sel.s===side&&r.sel.id===id?'sel':''} ${r.flash&&r.flash.includes(side+id)?'bad':''}" ${r.done.includes(id)?'disabled':''} onclick="matchTap('${side}',${id})">${esc(t)}</button>`;
 return hd('Mencocokkan')+`<div class="row sp sm"><span>Cocok ${r.done.length}/${r.total}</span><span>Salah ${r.mist}</span></div>${pb(r.done.length/r.total*100)}<p class="sm mu">Ketuk istilah, lalu ketuk pengertiannya.</p><div class="mt"><div style="display:grid;gap:8px">${r.left.map(id=>btn(id,'l',shortT(c(id).front,70))).join('')}</div><div style="display:grid;gap:8px">${r.right.map(id=>btn(id,'r',shortT(c(id).back,90))).join('')}</div></div>`}
function matchTap(side,id){const r=V.run;if(r.done.includes(id))return;if(!r.sel||r.sel.s===side){r.sel={s:side,id};render();return}const a=r.sel.s==='l'?r.sel.id:id,b=r.sel.s==='r'?r.sel.id:id;r.sel=null;
 if(a===b){r.done.push(a);r.flash=null;if(r.done.length>=r.total){r.items.forEach(x=>review(x,r.wrong.includes(x)?'b':'g','match',5));r.correct=r.total-r.wrong.length;r.miss=r.wrong.slice();r.score=Math.max(0,r.correct*10-r.mist*3);runFinish();return}render()}
 else{r.mist++;[a,b].forEach(x=>{if(!r.wrong.includes(x))r.wrong.push(x)});r.flash=['l'+a,'r'+b];render();setTimeout(()=>{if(V.run===r){r.flash=null;render()}},500)}}

function memTap(i){const r=V.run;if(r.lock||r.up.includes(i))return;r.up.push(i);if(r.up.length===2){r.moves++;const [a,b]=r.up.map(k=>r.tiles[k]);if(a.id===b.id&&a.s!==b.s){r.done.push(a.id);r.up=[];if(r.done.length>=r.total){r.correct=r.total;r.score=Math.max(0,100-(r.moves-r.total)*5);render();setTimeout(()=>{if(V.run===r)runFinish()},600);return}}else{r.lock=true;render();setTimeout(()=>{if(V.run===r){r.up=[];r.lock=false;render()}},800);return}}render()}

 if(g.summary)h+=`<h2>Rangkuman</h2><div class="c" style="white-space:pre-wrap">${esc(g.summary)}</div><div class="row"><button class="btn sec f1" onclick="noteForm(0,{title:'Rangkuman',text:V.gen.summary})">Simpan ke catatan</button><button class="btn sec f1" onclick="fbCopy(V.gen.summary)">Salin</button></div>`;
 if(g.items){h+=`<h2>Pratinjau (${g.items.filter(x=>x.on!==false).length}/${g.items.length})</h2>${g.bad?`<p class="sm warn">${g.bad} item dari AI dibuang karena strukturnya tidak valid.</p>`:''}<p class="sm mu">Periksa dulu sebelum disimpan. Hasil AI bisa keliru.</p>`+g.items.map((x,i)=>`<div class="c"><label class="row"><input type="checkbox" ${x.on!==false?'checked':''} onchange="V.gen.items[${i}].on=this.checked;render()"><b class="f1">${esc(shortT(x.front,160))}</b></label>${x.qt==='mcq'?x.opts.map((o,k)=>`<div class="sm ${k===x.ans?'ok':''}">${k===x.ans?'✅':'▫️'} ${esc(o)}</div>`).join(''):x.qt==='tf'?`<div class="sm ${x.ans?'ok':'bad'}">${x.ans?'Benar':'Salah'}</div>`:`<div class="sm">${esc(shortT(x.back,260))}</div>`}${x.expl?`<div class="sm mu">${esc(shortT(x.expl,200))}</div>`:''}<div class="row" style="margin-top:6px"><button class="ib" onclick="cardForm(0,0,0,${i},V.gen.items[${i}])">Edit</button></div></div>`).join('')+`<div class="c"><h3>Simpan ke</h3><div class="g2"><select id="gss" onchange="V.gen.sid=+this.value;$('gsc').innerHTML=chapOpts(this.value,0)+'<option value=-1>+ Bab baru…</option>'">${subjOpts(g.sid)}</select><select id="gsc">${chapOpts(g.sid,g.cid)}<option value="-1">+ Bab baru…</option></select></div><input id="gsn" placeholder="Nama bab baru (jika memilih bab baru)" style="margin-top:6px"><div class="err" id="fe2"></div><button class="btn w" onclick="genSave()">Simpan yang dipilih</button><button class="btn sec w" style="margin-top:8px" onclick="V.gen.items=null;render()">Batalkan hasil</button></div>`}return h}

 <div class="c"><input type="file" accept=".txt,.csv,.tsv,.json,.docx,.pdf,image/*,text/plain,text/csv,application/json" onchange="impFile(this)" aria-label="Pilih file"><label class="f" for="it">Atau tempel teks</label><textarea id="it" rows="6" placeholder="Tempel materi di sini" oninput="V.imp.text=this.value">${esc(m.text)}</textarea><div class="err" id="fe">${esc(m.info||'')}</div><button class="btn w" onclick="impRead()">Baca & pratinjau</button></div>`;

  <div class="c"><h3>Simpan ke</h3><div class="g2"><select id="ims" onchange="V.imp.sid=+this.value;$('imc').innerHTML=chapOpts(this.value,0,1)">${subjOpts(m.sid)}</select><select id="imc">${chapOpts(m.sid,m.cid,1)}</select></div>${S.subjects.length?'':'<p class="sm bad">Buat mata pelajaran dulu di Kelola Materi.</p>'}<p class="sm mu">Bab kosong = pakai bab dari judul di file, atau bab pertama.</p><div class="err" id="fe2"></div><button class="btn w" onclick="impSave()">Simpan yang dipilih</button></div>`}return h}
function impFile(el){const f=el.files&&el.files[0];if(!f)return;const nm=f.name||'',isPdf=/\.pdf$/i.test(nm)||f.type==='application/pdf',isDocx=/\.docx$/i.test(nm),isImg=/^image\//.test(f.type)||/\.(png|jpe?g|webp|bmp|gif)$/i.test(nm);
 if(/\.doc$/i.test(nm)){V.imp.info='File .doc lama tidak didukung. Simpan ulang sebagai .docx atau PDF.';render();return}
 if(isPdf||isDocx||isImg){if(f.size>(isImg?15e6:30e6)){V.imp.info='File terlalu besar.';render();return}impBinary(f);return}
 if(f.size>3e6){V.imp.info='File terlalu besar (maks 3 MB).';render();return}const r=new FileReader();r.onload=()=>{V.imp.text=String(r.result);V.imp.name=f.name;impRead()};r.onerror=()=>{V.imp.info='File tidak bisa dibaca.';render()};r.readAsText(f)}
async function impBinary(f){const m=V.imp;const prog=t=>{const e=$('fe');if(e){e.className='sm mu';e.textContent=t}};prog('Membaca '+f.name+'...');
 try{const r=await extractFile(f,prog),text=r.text||'';

 if(!r.cards.length){m.info='Tidak ada pasangan kartu yang terbaca.'+(r.un&&r.un.length?' Coba format "istilah | pengertian" per baris, atau gunakan AI.':'');m.un=r.un||[];render();return}

 try{const b=new Blob([text],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Berkas disiapkan. Cek folder Unduhan.');return true}catch(e){toast('Unduhan tidak didukung di sini. Pakai Salin backup.');return false}}
